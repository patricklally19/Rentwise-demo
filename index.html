function repairType(issue){const t=String(issue||'').toLowerCase();if(/gas safety|gas certificate|cp12|gas inspection/.test(t))return 'Gas safety inspection';if(/tap|faucet|drip/.test(t))return 'Leaking tap';if(/drain|blocked pipe/.test(t))return 'Blocked drain';if(/toilet|cistern|flush/.test(t))return 'Toilet repair';if(/electric|socket|light|wiring/.test(t))return 'Electrical fault';if(/boiler|radiator|heating|hot water/.test(t))return 'Heating / boiler';if(/window|glass/.test(t))return 'Broken window';if(/fence|garden|gate/.test(t))return 'Fence / garden';if(/roof|gutter/.test(t))return 'Roof / gutter';return 'Other repair'}
function repairInitRules(){
 const sr=REPAIRS.smartRules;
 if(!sr||typeof sr!=='object')REPAIRS.smartRules={defaults:{},overrides:{}};
 const rules=REPAIRS.smartRules;
 if(!rules.defaults||typeof rules.defaults!=='object')rules.defaults={};
 if(!rules.overrides||typeof rules.overrides!=='object')rules.overrides={};
 let changed=!sr;
 REPAIR_TYPES.forEach(type=>{
  const current=rules.defaults[type];
  if(!current||typeof current!=='object'){
   const alwaysAsk=['Electrical fault','Heating / boiler','Roof / gutter','Tap repair / washer','Tap replacement','Replace one fence panel','Replace whole fence'].includes(type);
   rules.defaults[type]={mode:alwaysAsk?'ask':'auto',limit:alwaysAsk?0:type==='Gas safety inspection'?150:type==='Leaking tap'?50:Number(REPAIRS.settings?.limit)||200};
   changed=true;
  }else{

 if(!Number.isFinite(Number(j.invoice))||!(Number(j.invoice)>0))return 'Invalid invoice total';
 if(Math.abs(Number(j.invoice)-Number(j.approved))>0.009)return 'Invoice differs from authorised total';
 if(rwPendingVariation(j))return 'Unapproved scope or price variation';
 if(!j.invoiceEvidence||(j.type!=='Gas safety inspection'&&!j.afterPhoto))return 'Completion evidence or invoice missing';
 if(j.compliance&&j.compliance.status!=='Validated')return 'Compliance record awaiting validation';
 if(j.aiFlag||j.priceFlag||j.evidenceFlag||j.duplicateFlag||j.reviewFlag)return 'Unresolved safety, pricing or evidence flag';
 if(!j.evidenceReviewed)return 'Completion evidence has not been reviewed';
 if(j.paymentNeedsApproval&&!j.paymentApproved)return 'Landlord must separately approve this invoice';
 if(!manual&&!WALLET.automatic)return 'Automatic payments disabled';
 if(!manual&&!eligibleAutoPaymentContractor(j.contractor,j))return 'Contractor not eligible for delegated payment';
 return '';
}
function walletPayJob(j,manual){const hold=rwPaymentHoldReason(j,manual);if(hold){j.paymentStatus=hold;repairSave();return false;}if(rwPendingVariation(j)){j.paymentStatus='Revised quote awaiting landlord approval';return false}if(j.compliance&&j.compliance.status!=='Validated'){j.paymentStatus='Safety document requires landlord review';return false}if(!j.invoiceEvidence||(j.type!=='Gas safety inspection'&&!j.afterPhoto)){j.paymentStatus='Invoice and completion evidence required';return false}if(j.invoice!==j.approved){j.paymentStatus='Invoice differs from approved quote — landlord review required';return false}if(!j.evidenceReviewed){j.paymentStatus='Evidence needs human review before payment';repairSave();return false}if(j.paid||j.status!=='Completed'||!(j.invoice>0))return false;if(j.paymentNeedsApproval&&!j.paymentApproved)return false;if(!walletDebit(j.property,j.invoice)){j.paymentStatus='Awaiting funds · '+gbp(Math.max(0,j.invoice-walletAvailable(j.property)))+' shortfall';repairLog(j,'Payment pending: insufficient demo wallet funds');repairSave();return false}j.status='Paid';j.paid=true;j.paymentStatus='Paid (demo)';walletRecord(j.property,-j.invoice,'Contractor invoice ['+j.id+']: '+j.issue);repairLog(j,(manual?'Landlord approved':'Automatically processed')+' '+gbp(j.invoice)+' contractor invoice from demo wallet; no money moved');repairSave();return true}
function walletAttemptPayment(j){if(!j||j.paid||j.status!=='Completed')return false;const hold=rwPaymentHoldReason(j,false);if(hold){j.paymentStatus=hold;repairSave();return false}return walletPayJob(j,false)}

ilable</span><h2>${gbp(P.reduce((n,p)=>n+walletPayoutAvailable(p.addr),0))}</h2></div><div><span class="mut">Reserve target per property</span><h2>${gbp(walletReserveTarget(P[0].addr))}</h2></div></div><p class="mut" style="font-size:12px">Reserve is a protected amount within each property's simulated wallet, not extra money. Approved repairs may spend it; payouts cannot. The £200 suggestion can be changed or switched off below.</p></div><div class="grid two"><div class="card"><h2>Balance settings</h2><form id="wallet-settings" class="market-form"><label>Manage available money as</label><select name="mode"><option value="combined" ${WALLET.mode==='combined'?'selected':''}>One combined balance</option><option value="separate" ${WALLET.mode==='separate'?'selected':''}>Separate property balances</option></select><label><input type="checkbox" name="reserveEnabled" ${WALLET.reserveEnabled?'checked':''} style="width:auto;min-height:0"> Keep a maintenance reserve for each property</label><label>Maintenance reserve target per property (£)</label><input type="number" min="0" max="100000" step="1" name="reserveTarget" value="${WALLET.reserveTarget}"><p class="mut">Choose £0 or untick the box to pay out all remaining rent. An existing reserve is topped up only after repairs reduce it.</p><label>Landlord withdrawal method</label><select name="withdrawal"><option value="percentage" ${WALLET.withdrawal==='percentage'?'selected':''}>Automatic percentage of available rent</option><option value="fixed" ${WALLET.withdrawal==='fixed'?'selected':''}>Fixed amount</option><option value="manual" ${WALLET.withdrawal==='manual'?'selected':''}>Manual only</option></select><label>Percentage of remaining rent sent to landlord (0–100%)</label><input type="number" min="0" max="100" name="percent" value="${WALLET.percent}"><label>Fixed withdrawal amount (£)</label><input type="number" min="0" max="100000" name="fixed" value="${WALLET.fixed}"><label><input type="checkbox" name="autoOnClear" ${WALLET.autoOnClear?'checked':''} style="width:auto;min-height:0"> Automatically send rent above maintenance reserve to landlord</label><label><input type="checkbox" name="automatic" ${WALLET.automatic?'checked':''} style="width:auto;min-height:0"> Automatically pay eligible trusted-contractor invoices when funds are available</label><button class="btn" style="margin-top:12px" type="submit">Save wallet preferences</button></form></div><div class="card"><h2>Try the wallet demo</h2><p class="mut">Simulate rent arriving automatically: pay eligible approved invoices first, then send the remainder to the landlord without monthly approval.</p><form id="wallet-rent" class="market-form"><label>Property receiving rent</label><select name="property">${P.map(p=>`<option value="${me(p.addr)}">${me(p.addr)}</option>`).join('')}</select><label>Amount (£)</label><input type="number" name="amount" min="1" max="100000" required value="1200"><button class="btn" style="margin-top:12px" type="submit">Simulate tenant rent payment</button></form><div class="row"><b>Payments awaiting provider confirmation (${(WALLET.pending||[]).length})</b></div>${(WALLET.pending||[]).map(x=>`<div class="row"><div><b>${me(x.property)}</b><br><span class="mut">${gbp(x.amount)} processing · not available${x.source==='tenant'?' · Tenant initiated':''}</span></div><button class="btn g" data-wallet-clear="${me(x.id)}">Mark cleared (demo)</button></div>`).join('')||'<p class="mut">No rent processing.</p>'}<div class="row"><b>Withdraw cleared balance (demo)</b></div><form id="wallet-withdraw" class="market-form"><label>Property (for separate balances)</label><select name="property">${P.map(p=>`<option value="${me(p.addr)}">${me(p.addr)}</option>`).join('')}</select><label>Manual withdrawal (£)</label><input name="amount" type="number" min="1" max="100000" required value="100"><button class="btn g" type="submit" style="margin-top:12px">Simulate withdrawal</button></form><button class="btn g" data-wallet-auto style="margin-top:10px">Simulate scheduled withdrawal</button></div></div><div class="card" style="margin-top:12px"><h2>Property balances</h2>${P.map(p=>`<div class="row"><span>${me(p.addr)}<br><small class="mut">Reserve ${gbp(walletReserveHeld(p.addr))} · Payout available ${gbp(walletPayoutAvailable(p.addr))}</small></span><b>${gbp(WALLET.balances[p.addr]||0)}</b></div>`).join('')}</div><div class="card" style="margin-top:12px"><h2>Contractor invoices awaiting payment (${pending.length})</h2>${pending.length?pending.map(j=>`<div class="row"><div><b>${me(j.issue)}</b><br><span class="mut">${me(j.property)} · ${me(j.paymentStatus||'Awaiting payment')}</span></div><b>${gbp(j.invoice)}</b></div>`).join(''):'<p class="mut">No outstanding completed-job invoices.</p>'}</div><div class="card" style="margin-top:12px"><h2>Wallet activity</h2>${WALLET.ledger.length?WALLET.ledger.slice(0,25).map(x=>`<div class="row"><div><b>${me(x.description)}</b><br><span class="mut">${me(x.property)} · ${me(x.at)}</span></div><b style="color:${x.amount<0?'var(--bad)':'var(--ok)'}">${x.amount<0?'−':'+'}${gbp(Math.abs(x.amount))}</b></div>`).join(''):'<p class="mut">No demo transactions yet. Simulate a rent payment to start.</p>'}</div>`}

// V12: 45-day compliance orchestration demonstration. Nothing is actually sent.
const V12_KEY='rentwise-v12-compliance';
function v12Load(){try{return JSON.parse(localStorage.getItem(V12_KEY))||{}}catch(e){return {}}}
let V12=v12Load();
function v12Save(){try{localStorage.setItem(V12_KEY,JSON.stringify(V12))}catch(e){toast('Unable to save compliance demo')}}
function v12Due(p){return v11GasRecord(p.addr)?.due||p.c[0]}
function v12Days(date){const d=new Date(date+'T12:00:00');return Number.isFinite(d.getTime())?Math.ceil((d-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12))/86400000):9999}
function v12Job(p){return REPAIRS.jobs.find(j=>j.id===V12[p.addr]?.job)}
function v12Start(p){if(v12Job(p))return v12Job(p);const engineer=assignedContractor(p.addr,'Gas safety');const qualified=eligibleContractor(REPAIRS.contractors.find(c=>c.id===engineer),'Gas safety');const j={id:'gas-renew-'+Date.now()+'-'+p.id,property:p.addr,issue:'Gas safety inspection',type:'Gas safety inspection',priority:'Routine',description:'Renewal initiated by RentWise 45-day compliance monitor (simulation). Gas Safe registration and access arrangements require verification.',status:'Reported',quotes:[],contractor:'',invitedContractor:qualified?engineer:'',approved:0,invoice:0,paid:false,events:[{at:new Date().toLocaleString('en-GB'),message:qualified?'RentWise flagged expiry within 45 days and queued invitation to assigned gas engineer (demo; nothing sent)':'Gas safety renewal due: no eligible assigned engineer. Landlord action required.'}]};REPAIRS.jobs.push(j);V12[p.addr]={job:j.id,invited:qualified,started:new Date().toISOString(),previousDue:v12Due(p)};repairSave();v12Save();return j}
function v12Scan(){let count=0;P.forEach(p=>{const d=v12Days(v12Due(p));if(d<=45&&!v12Job(p)){v12Start(p);count++}});return count}
function v12Page(){repairInitRules();const rows=P.map(p=>({p,days:v12Days(v12Due(p)),job:v12Job(p)})).sort((a,b)=>a.days-b.days);const active=rows.filter(x=>x.days<=45||x.job);return `<h1>Compliance</h1><p class="mut">Renewals, inspections and certificates in one place.</p><details class="rw-disclosure"><summary>About this demonstration</summary><p>Demo only. No contractor is contacted and no real AI validates documents. A qualified person must verify the engineer, inspection results and due dates.</p></details>
<div class="grid k4" style="margin:12px 0"><div class="card kpi"><span class="mut">Within 45 days / overdue</span><b>${rows.filter(x=>x.days<=45).length}</b></div><div class="card kpi"><span class="mut">Renewal jobs opened</span><b>${active.filter(x=>x.job).length}</b></div><div class="card kpi"><span class="mut">Need approval</span><b>${active.filter(x=>x.job?.status==='Quotes received').length}</b></div><div class="card kpi"><span class="mut">Awaiting validation</span><b>${active.filter(x=>x.job?.compliance?.status==='Awaiting landlord review').length}</b></div></div>
<div class="card"><h2>Upcoming renewals</h2><p class="mut">See which inspections need arranging.</p><button class="btn" data-v12-scan>Run 45-day scan (demo)</button></div>
<div class="card" style="margin-top:12px"><h2>Renewal workflow</h2>${active.length?active.map(({p,days,job})=>`<div style="padding:14px 0;border-top:1px solid var(--line)"><div class="row"><div><b>${me(p.addr)}</b><br><span class="mut">Gas safety due ${me(v12Due(p))} · ${days<0?Math.abs(days)+' days overdue':days+' days left'}</span></div><span class="chip ${days<0?'bad':days<=45?'warn':'ok'}">${days<0?'Overdue':days<=45?'Renewal window':'In progress'}</span></div>
${!job?'<p class="mut">No renewal initiated yet.</p>':`<p><b>Stage:</b> ${me(job.status)} · ${me(job.paymentStatus||'Awaiting quote / inspection')}</p><p class="mut">Assigned engineer: ${me(REPAIRS.contractors.find(c=>c.id===job.invitedContractor)?.name||'None — landlord must assign a qualified engineer')} · ${job.invitedContractor?'invitation queued (simulation only)':'landlord action required'}</p>${job.invitedContractor&&(job.status==='Reported'||job.status==='Quotes received')?`<form data-v12-quote="${me(job.id)}" class="market-form"><label>Engineer quote (£)</label><input type="number" name="amount" min="1" max="100000" value="95" required><button class="btn" type="submit" style="margin-top:8px">Simulate engineer quote</button></form>`:''}${job.status==='Quotes received'?'<p class="chip warn">Landlord approval required — check approval settings in Repairs</p>':''}${job.status==='Approved'?'<p class="chip ok">Quote approved — contractor can upload certificate and invoice</p>':''}${job.compliance?.status==='Awaiting landlord review'?'<p class="chip warn">Safety record awaits human validation — no automatic compliance clearance</p>':''}${job.status==='Paid'?'<p class="chip ok">Validated renewal and invoice paid (demo)</p>':''}<button class="btn g" data-v12-open="${me(job.id)}" style="margin-top:8px">Open job in AI Repairs</button><button class="btn g" data-v12-contractor="${me(job.id)}" style="margin-top:8px">Open contractor upload</button>`}</div>`).join(''):'<p class="mut">No gas certificates due within 45 days.</p>'}</div>
<div class="card" style="margin-top:12px"><h2>All properties</h2>${rows.map(({p,days})=>`<div class="row"><div><b>${me(p.addr)}</b><br><span class="mut">Next gas safety date: ${me(v12Due(p))}</span></div><span class="chip ${days<=45?'warn':'ok'}">${days<0?'Overdue':days+' days'}</span></div>`).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-v12-scan],[data-v12-open],[data-v12-contractor]');if(!b)return;if(b.hasAttribute('data-v12-scan')){const n=v12Scan();toast(n+' renewal jobs created (demo)')}else if(b.dataset.v12Open){repairSelected=b.dataset.v12Open;repairTab='jobs';DEMO_ROLE='landlord';S.v='repairs'}else if(b.dataset.v12Contractor){const j=REPAIRS.jobs.find(x=>x.id===b.dataset.v12Contractor);if(j?.contractor)DEMO_CONTRACTOR=j.contractor;else DEMO_CONTRACTOR=j?.invitedContractor||'gas-demo';DEMO_ROLE='contractor';S.v='contractor'}render()});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-v12-quote]');if(!form)return;e.preventDefault();const j=REPAIRS.jobs.find(x=>x.id===form.dataset.v12Quote);if(!j||!['Reported','Quotes received'].includes(j.status))return;const amt=Number(new FormData(form).get('amount'));if(!(amt>0&&amt<=100000))return;const q={contractor:j.invitedContractor,amount:amt};if(!q.contractor){toast('Assign a qualified gas engineer first');return}q.decision=repairDecide(j,q);j.quotes.push(q);repairLog(j,'Gas engineer quote '+gbp(amt)+': '+q.decision);if(q.decision.startsWith('Eligible for automatic approval'))repairApprove(j,q,true);else j.status='Quotes received';repairSave();render();toast(q.decision)});


// V13: Demonstration inspection scheduling and rent statements. All local-only.
const INSPECT_KEY='rentwise-inspections-v1';
function inspectionLoad(){try{const x=JSON.parse(localStorage.getItem(INSPECT_KEY));if(x&&Array.isArray(x.jobs)&&x.schedule)return x}catch(e){}return {schedule:Object.fromEntries(P.map(p=>[p.addr,{months:6,last:'2026-04-16',inspector:'Demo Property Inspector',fee:75,limit:100}])),jobs:[]}}
let INSPECT=inspectionLoad();
function inspectionSave(){try{localStorage.setItem(INSPECT_KEY,JSON.stringify(INSPECT))}catch(e){toast('Unable to save inspection demo')}}
function nextInspection(addr){const r=INSPECT.schedule[addr];if(!r||!r.last)return null;const d=new Date(r.last+'T12:00:00');if(isNaN(d))return null;const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(r.months||6));const end=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,end));return d.toISOString().slice(0,10)}
function inspectionJob(addr){return INSPECT.jobs.find(j=>j.property===addr&&!['Completed','Cancelled'].includes(j.status))}
function inspectionScan(){let n=0;P.forEach(p=>{const due=nextInspection(p.addr);if(!due||inspectionJob(p.addr))return;const days=v12Days(due);if(days>30)return;const r=INSPECT.schedule[p.addr];INSPECT.jobs.unshift({id:'inspection-'+Date.now()+'-'+p.id,property:p.addr,due,inspector:r.inspector||'',fee:Number(r.fee)||0,limit:Number(r.limit)||0,status:'Awaiting access confirmation',report:'',issues:'',completed:'',paid:false,created:new Date().toLocaleDateString('en-GB')});n++});if(n)inspectionSave();return n}
function jobsPage(){const repairs=REPAIRS.jobs.filter(j=>j.type!=='Gas safety inspection'),gas=REPAIRS.jobs.filter(j=>j.type==='Gas safety inspection'),insp=INSPECT.jobs;const decisions=REPAIRS.jobs.filter(j=>j.status==='Quotes received'||j.paymentNeedsApproval&&j.status==='Completed'&&!j.paid).length+insp.filter(j=>j.status==='Needs landlord review').length;return `<h1>Automatic jobs</h1><p class="mut">A clear view of work RentWise has started or is waiting to arrange.</p><div class="grid k4" style="margin:12px 0"><div class="card kpi"><span class="mut">Gas renewals</span><b>${gas.length}</b></div><div class="card kpi"><span class="mut">Repairs</span><b>${repairs.filter(j=>j.status!=='Completed').length}</b></div><div class="card kpi"><span class="mut">Inspections</span><b>${insp.length}</b></div><div class="card kpi"><span class="mut">Needs review</span><b>${decisions}</b></div></div><div class="card"><h2>How automation works</h2><p>RentWise checks upcoming due dates when you open the demo, prepares work for assigned contractors and requests approval when needed. In this prototype invitations are simulated, not sent. Tenant access must be agreed before an inspection is booked.</p><div class="chips"><button class="btn" data-v="v12">Gas certificate renewals</button><button class="btn g" data-v="inspections">Property inspections</button><button class="btn g" data-v="repairs">Repairs and contractors</button></div></div><div class="card" style="margin-top:12px"><h2>Recent jobs</h2>${[...gas,...repairs].slice(-12).reverse().map(j=>`<div class="row"><div><b>${me(j.property)}</b><br><span class="mut">${me(j.issue)} · ${me(j.status)}</span></div><button class="btn g" data-job-open="${me(j.id)}">View</button></div>`).join('')}${insp.slice(0,8).map(j=>`<div class="row"><div><b>${me(j.property)}</b><br><span class="mut">Inspection · ${me(j.status)}</span></div><button class="btn g" data-v="inspections">View</button></div>`).join('')}</div>`}
function inspectionsPage(){const pending=INSPECT.jobs.filter(j=>j.status!=='Completed');return `<h1>Property inspections</h1><p class="mut">RentWise prepares routine inspection jobs. A tenant must agree access before an appointment is confirmed.</p><div class="card"><h2>Inspection schedule</h2><p class="mut">Sample default: every six months, adjustable by property. No universal six-month statutory inspection interval is assumed.</p><button class="btn" data-inspect-scan>Check upcoming inspections</button></div><div class="card" style="margin-top:12px"><h2>Inspection jobs (${INSPECT.jobs.length})</h2>${INSPECT.jobs.length?INSPECT.jobs.map(j=>`<div class="evidence"><b>${me(j.property)}</b> <span class="chip ${j.status==='Completed'?'ok':'warn'}">${me(j.status)}</span><p class="mut">Due ${me(j.due)} · ${me(j.inspector||'Inspector not assigned')} · Proposed fee ${gbp(j.fee)}</p>${j.status==='Awaiting access confirmation'?`<p class="mut">Proposed visit only. No booking has been sent. Confirm tenant agreement and inspector availability first.</p><button class="btn" data-inspect-access="${me(j.id)}">Confirm access agreed (demo)</button>`:''}${j.status==='Booked (demo)'?`<form class="market-form" data-inspect-complete="${me(j.id)}"><label>Inspection date</label><input type="date" name="date" required><label>Inspection report / observations</label><textarea name="report" required minlength="15" placeholder="Condition, photographs reviewed separately, rooms inspected..." ></textarea><label>Hazards or follow-up work</label><textarea name="issues" placeholder="Describe concerns; serious hazards need landlord review"></textarea><button class="btn" type="submit">Submit inspection report (demo)</button></form>`:''}${j.status==='Needs landlord review'?`<p><b>Report:</b> ${me(j.report)}</p><p><b>Issues:</b> ${me(j.issues||'None recorded')}</p><button class="btn" data-inspect-approve="${me(j.id)}">Approve report and simulated invoice</button>`:''}${j.status==='Completed'?`<p><b>Report:</b> ${me(j.report)}</p><p class="mut">Completed ${me(j.completed)} · ${j.paid?'Invoice paid from demo wallet':'Invoice recorded; insufficient funds or manual payment required'}</p>`:''}</div>`).join(''):'<p class="mut">No inspection jobs yet. Check upcoming inspections to create sample jobs.</p>'}</div><div class="card" style="margin-top:12px"><h2>Property inspection settings</h2>${P.map(p=>{const r=INSPECT.schedule[p.addr];return `<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div><b>${me(p.addr)}</b><br><span class="mut">Next due: ${me(nextInspection(p.addr)||'Not set')}</span></div><form class="market-form" data-inspect-settings="${me(p.addr)}" style="display:flex;flex-wrap:wrap;gap:5px;align-items:end"><label>Every <select name="months">${[3,6,12].map(v=>`<option value="${v}" ${Number(r.months)===v?'selected':''}>${v} months</option>`).join('')}</select></label><label>Fee £<input name="fee" type="number" min="1" max="5000" value="${Number(r.fee)||75}" style="width:80px"></label><button class="btn g" type="submit">Save</button></form></div>`}).join('')}</div>`}
function statementsPage(){const months=[...new Set(WALLET.ledger.map(x=>{const m=String(x.at||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]:''}).filter(Boolean))].sort().reverse();const current=new Date().toISOString().slice(0,7);const month=window.RW_STATEMENT_MONTH||months[0]||current;const entries=WALLET.ledger.filter(x=>{const m=String(x.at||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m&&m[3]+'-'+m[2]===month});const incoming=entries.filter(x=>x.amount>0).reduce((n,x)=>n+x.amount,0);const outgoing=entries.filter(x=>x.amount<0).reduce((n,x)=>n-x.amount,0);return `<h1>Rental statements</h1><p class="mut">Monthly records generated from demo wallet transactions — not the illustrative Finance charts.</p><div class="card"><div class="chips"><label>Statement month <select id="rw-statement-month">${[...new Set([month,current,...months])].sort().reverse().map(m=>`<option value="${m}" ${month===m?'selected':''}>${m}</option>`).join('')}</select></label><button class="btn g" data-statement-print>Print / save as PDF</button></div><h2>Portfolio statement · ${me(month)}</h2>${kv([['Rent and other credits',gbp(incoming)],['Payments and withdrawals',gbp(outgoing)],['Net wallet movement',gbp(incoming-outgoing)]])}<p class="mut">Amounts reflect the transactions recorded in this device only. This is not a tax or bank statement.</p></div><div class="card" style="margin-top:12px"><h2>Property breakdown</h2>${P.map(p=>{const tx=entries.filter(x=>x.property===p.addr);const sum=tx.reduce((n,x)=>n+x.amount,0);return `<details class="rw-disclosure"><summary>${me(p.addr)} · ${gbp(sum)} net (${tx.length} transactions)</summary>${tx.length?tx.map(x=>`<div class="row"><div><b>${me(x.description)}</b><br><span class="mut">${me(x.at)}</span></div><b>${x.amount<0?'−':''}${gbp(Math.abs(x.amount))}</b></div>`).join(''):'<p>No wallet transactions recorded for this month.</p>'}</details>`}).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-inspect-scan],[data-inspect-access],[data-inspect-approve],[data-job-open],[data-statement-print]');if(!b)return;if(b.hasAttribute('data-inspect-scan')){const n=inspectionScan();toast(n+' inspection jobs prepared (demo)')}else if(b.dataset.inspectAccess){const j=INSPECT.jobs.find(x=>x.id===b.dataset.inspectAccess);if(j&&j.status==='Awaiting access confirmation'){j.status='Booked (demo)';inspectionSave();toast('Visit marked booked in demo; no message sent')}}else if(b.dataset.inspectApprove){const j=INSPECT.jobs.find(x=>x.id===b.dataset.inspectApprove);if(j&&j.status==='Needs landlord review'){j.status='Completed';INSPECT.schedule[j.property].last=j.completed;const paid=Number(j.fee)>0&&Number(j.fee)<=Number(j.limit)&&WALLET.automatic&&walletDebit(j.property,Number(j.fee));j.paid=!!paid;if(paid)walletRecord(j.property,-Number(j.fee),'Routine property inspection (demo)');inspectionSave();toast(paid?'Inspection completed and simulated payment recorded':'Inspection completed; payment requires attention')}}else if(b.dataset.jobOpen){repairSelected=b.dataset.jobOpen;repairTab='jobs';DEMO_ROLE='landlord';S.v='repairs'}else if(b.hasAttribute('data-statement-print')){window.print();return}render()});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-inspect-settings],[data-inspect-complete]');if(!form)return;e.preventDefault();const f=new FormData(form);if(form.dataset.inspectSettings){const r=INSPECT.schedule[form.dataset.inspectSettings];r.months=Number(f.get('months'));r.fee=Number(f.get('fee'));inspectionSave();toast('Inspection settings saved')}else{const j=INSPECT.jobs.find(x=>x.id===form.dataset.inspectComplete);if(j&&j.status==='Booked (demo)'){const date=String(f.get('date')||''),report=String(f.get('report')||'').trim();if(!date||report.length<15){toast('Enter inspection date and report');return}j.completed=date;j.report=report;j.issues=String(f.get('issues')||'').trim();j.status='Needs landlord review';inspectionSave();toast('Inspection report submitted for landlord review')}}render()});
document.addEventListener('input',e=>{if(e.target.id==='rw-price-search'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-rw-price-type]').forEach(el=>{el.style.display=el.dataset.rwPriceType.toLowerCase().includes(q)?'':'none'})}});

/* RentWise fictional document previews — illustrative only, not valid certificates or legal forms. */
function rwExampleDocument(kind,p){
 const today='17 October 2026', address=me(p.addr+', '+p.area), tenant=me(p.ten);
 const head=(title,sub)=>`<div class="rw-doc-header"><div><strong>RentWise</strong><small>YOUR PROPERTY. YOUR WAY.</small></div><span>EXAMPLE DOCUMENT</span></div><h2>${title}</h2><p class="mut">${sub}</p><div class="rw-doc-watermark">FICTIONAL DEMONSTRATION · NOT VALID FOR LEGAL USE</div>`;
 const row=(a,b)=>`<div class="row"><span class="mut">${a}</span><b style="text-align:right">${b}</b></div>`;
 const prop=row('Property',address), sample='RW-DEMO-'+String(p.id+1).padStart(3,'0');
