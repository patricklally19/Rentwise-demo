.mut{color:var(--mut)}.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}

.tap{cursor:pointer}.tap:hover{border-color:var(--brand)}button:focus-visible,.tap:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.draft{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font-size:14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
.bx{height:10px;border-radius:6px;background:var(--brand)}.ai{border-left:5px solid var(--warn)}.ai.bad{border-left-color:var(--bad)}

/* RentWise Marketplace */
.market-head{background:linear-gradient(125deg,#0e5a57,#137b71);color:white;border-radius:18px;padding:22px;margin:12px 0 18px}.market-head h1{font-size:29px}.market-head p{opacity:.92}

@media(max-width:420px){nav .b{font-size:10px}nav svg{width:21px;height:21px}}

/* AI repairs demo */

.repair-layout label{display:block;font-size:13px;color:var(--mut);margin:8px 0 5px}
.repair-layout input,.repair-layout select,.repair-layout textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c8d8d3;border-radius:9px;font:inherit;background:white;color:#12302f}
.repair-layout textarea{min-height:85px}.repair-steps{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.repair-steps .chip{font-size:12px}

.evidence{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;min-width:0}.evidence .btn{margin-top:6px}.market-form input[type=file]{padding:8px} </style></head><body>

<script>
const $=s=>document.querySelector(s),gbp=n=>'£'+Math.round(n).toLocaleString('en-GB'),T=new Date('2026-10-15');
const dd=s=>Math.round((new Date(s)-T)/864e5),fd=s=>new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const logo=`<span class="logo">${ic('M3 11l9-8 9 8M5 9.5V21h14V9.5M10 21v-6h4v6')}</span>`;
const NAV=[['showcase','Demo Tour','M3 5h18v14H3zM7 9h10M7 13h7'],['repairs','AI Repairs','M14 7l3 3-7 7-3-3zM3 21l6-6M16 3l5 5M4 4l4 4'],['market','Marketplace','M3 10l9-7 9 7v11H3zM9 21v-8h6v8'],['dash','Home','M3 11l9-8 9 8M5 9.5V21h14V9.5M10 21v-6h4v6'],['props','Properties','M3 21h18M5 21V8l7-5 7 5v13M9 21v-5h6v5'],['comp','Compliance','M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4'],['wallet','Wallet','M3 7h18v14H3zM3 11h18M16 16h2'],['fin','Finances','M4 20V11M10 20V4M16 20v-6M22 20H2'],['ai','AI Assistant','M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z']];
const raw=[
['14 Hollis Road','Leeds LS6 2BN','2-bed terrace','Amelia Hart',895,'2027-03-12','2029-05-01','2031-02-10','2027-01-20',0,'2027-04-30'],
['3 Marlow Court','Manchester M14 5QT','1-bed flat','Daniel Okafor',825,'2026-11-02','2028-08-14','2030-06-01','2027-04-01',0,'2027-02-14'],

{id:'rev',lv:'warn',t:'Rent review: Alderley Road tenancy ends 31 December',b:'Rent is £1,050. Similar homes nearby let for about £1,090 to £1,120 (demo estimate). I suggest offering a 12-month renewal at £1,095.',btn:'Review renewal offer',d:()=>[draft('Tom & Lucy Barrett (tom.lucy.barrett@example.com)','Renewing your tenancy at 52 Alderley Road','Hi Tom and Lucy,\n\nYour tenancy ends on 31 December. I would be glad to offer you a new 12-month agreement from 1 January at £1,095 a month. Please let me know if you would like to go ahead.')]}];

function marketBrowse(){let ls=MARKET.listings.filter(l=>l.status==='published');const q=MF.search.trim().toLowerCase();if(q)ls=ls.filter(l=>[l.title,l.address,l.city,l.postcode].join(' ').toLowerCase().includes(q));if(MF.city)ls=ls.filter(l=>l.city===MF.city);if(MF.max)ls=ls.filter(l=>l.rent<=+MF.max);if(MF.beds)ls=ls.filter(l=>l.beds>=+MF.beds);const cities=[...new Set(MARKET.listings.filter(l=>l.status==='published').map(l=>l.city))].sort();return `<div class="market-tools"><div><label>Search location or postcode</label><input id="market-search" placeholder="e.g. Guildford" value="${me(MF.search)}"></div><div><label>Location</label><select id="market-city"><option value="">Anywhere</option>${cities.map(c=>`<option ${MF.city===c?'selected':''}>${me(c)}</option>`).join('')}</select></div><div><label>Max rent / month</label><select id="market-max"><option value="">Any price</option>${[1000,1250,1500,2000,2500,3500].map(v=>`<option value="${v}" ${MF.max==v?'selected':''}>${gbp(v)}</option>`).join('')}</select></div><div><label>Minimum bedrooms</label><select id="market-beds"><option value="">Any</option>${[1,2,3,4].map(v=>`<option ${MF.beds==v?'selected':''} value="${v}">${v}+</option>`).join('')}</select></div></div><p class="mut">${ls.length} demonstration home${ls.length===1?'':'s'} found</p><div class="market-list" style="margin-top:12px">${ls.map(l=>marketCard(l)).join('')||'<div class="card market-empty">No matching homes. Try different filters.</div>'}</div>`}

function marketRequests(){return `<h2 style="margin-top:18px">Viewing requests</h2><p class="mut">Requests are saved only in this browser. No messages are sent.</p>${MARKET.requests.length?`<div class="grid">${MARKET.requests.slice().reverse().map(r=>{const l=MARKET.listings.find(x=>x.id===r.listing);return `<div class="card"><b>${me(l?.title||'Property')}</b><p>${me(r.name)} · ${me(r.email)}</p><p class="mut">Preferred viewing: ${me(r.date||'Flexible')}</p><p>${me(r.message||'No message')}</p><span class="chip ${r.status==='Reviewed'?'ok':'warn'}">${me(r.status||'New request')}</span> <button class="btn g" data-market-reviewed="${me(r.id)}">Mark reviewed</button></div>`}).join('')}</div>`:'<div class="card market-empty">No viewing requests yet. Open a listing and try the viewing form to see how it works.</div>'}`}

function marketForm(){const l=MARKET.listings.find(x=>x.id===MF.id)||{};const edit=!!l.id;return `<button class="btn t" data-market-back>← Back to my listings</button><h1>${edit?'Edit listing':'List a property'}</h1><p class="mut">Publish a fictional property for this investor demo.</p><div class="market-banner">Demo only: do not enter real tenant details, private documents or sensitive information. Information is saved on this device, not shared with other users.</div><form id="market-listing-form" class="card market-form"><label>Advert headline *</label><input name="title" required maxlength="100" value="${me(l.title||'')}" placeholder="e.g. Bright two-bedroom flat"><div class="two-fields"><div><label>Street address *</label><input name="address" required maxlength="100" value="${me(l.address||'')}"></div><div><label>Town or city *</label><input name="city" required maxlength="60" value="${me(l.city||'')}"></div></div><div class="two-fields"><div><label>Postcode *</label><input name="postcode" required maxlength="12" value="${me(l.postcode||'')}"></div><div><label>Rent per month (£) *</label><input name="rent" required type="number" min="1" max="100000" value="${me(l.rent||'')}"></div></div><div class="two-fields"><div><label>Bedrooms</label><input name="beds" type="number" min="0" max="30" value="${me(l.beds??2)}"></div><div><label>Bathrooms</label><input name="baths" type="number" min="1" max="30" value="${me(l.baths??1)}"></div></div><div class="two-fields"><div><label>Property type</label><select name="type">${['Flat','House','Studio','Bungalow','Maisonette','Other'].map(v=>`<option ${l.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Furnishing</label><select name="furnished">${['Unfurnished','Furnished','Part furnished'].map(v=>`<option ${l.furnished===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="two-fields"><div><label>EPC rating</label><select name="epc">${['A','B','C','D','E','F','G','Pending'].map(v=>`<option ${l.epc===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Available from</label><input name="available" type="date" value="${me(l.available||'')}"></div></div><label>Photo URL (optional)</label><input name="photo" type="url" maxlength="600" value="${me(l.photo||'')}" placeholder="https://... (public image URL)"><p class="market-small">For this first version, paste a public photo URL. Photo uploads will require storage in a future version.</p><label>Description</label><textarea name="description" maxlength="2000">${me(l.description||'')}</textarea><div class="market-actions"><button type="submit" name="action" value="draft" class="btn g">Save draft</button><button type="submit" name="action" value="published" class="btn">Publish demo listing</button>${edit?`<button type="button" class="btn g" data-market-withdraw="${me(l.id)}">${l.status==='withdrawn'?'Keep withdrawn':'Withdraw listing'}</button>`:''}</div></form>`}
function marketPage(){const head=`<div class="market-head"><h1>Find your next home</h1><p>Explore rental homes and manage adverts — all in RentWise.</p><span style="font-size:12px">Investor demonstration · fictional properties · no live bookings</span></div>`;if(MF.screen==='detail')return head+marketDetail();if(MF.screen==='form')return head+marketForm();return head+marketButtons()+(MF.tab==='manage'?marketManage():MF.tab==='requests'?marketRequests():marketBrowse())}

function docLoad(){try{return JSON.parse(localStorage.getItem(DOC_KEY))||{}}catch(e){return {}}}
let DOCS=docLoad();function docSave(){try{localStorage.setItem(DOC_KEY,JSON.stringify(DOCS))}catch(e){toast('Storage full: try smaller images')}}
function docImage(id){return DOCS[id]?.data||''}
function docPreview(id,label){const d=DOCS[id];return d?`<div class="evidence"><b>${me(label)}</b><p class="mut">${me(d.name)}</p>${d.data.startsWith('data:image/')?`<img src="${d.data}" alt="${me(label)}" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px">`:'<span class="chip ok">Document attached</span>'}<button class="btn g" data-doc-open="${me(id)}">View</button></div>`:''}
function docUpload(file,id,cb){if(!file){cb(null);return}if(file.size>6*1024*1024){toast('File exceeds 6 MB');return}if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(file.type)){toast('Use JPG, PNG, WebP or PDF');return}const reader=new FileReader();reader.onload=()=>{const save=data=>{DOCS[id]={name:file.name,type:file.type,data,at:new Date().toLocaleString('en-GB')};docSave();cb(id)};if(file.type==='application/pdf'){if(file.size>650000){toast('PDF too large for this offline demo (max 650 KB)');return}save(String(reader.result));return}const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);save(c.toDataURL('image/jpeg',.65))};im.src=String(reader.result)};reader.readAsDataURL(file)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-doc-open]');if(!b)return;const d=DOCS[b.dataset.docOpen];if(!d)return;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to view the file');return}if(d.type==='application/pdf'){w.document.write('<title>Demo document</title><iframe style="width:100%;height:100vh;border:0" src="'+d.data+'"></iframe>')}else{w.document.write('<title>Demo photo</title><img alt="Uploaded demo evidence" style="max-width:100%" src="'+d.data+'">')}w.document.close()});
const repairDefaults=()=>({settings:{limit:200,monthly:600,spent:0,preferredOnly:true},contractors:[{id:'c1',name:'Greenfield Plumbing',trade:'Plumbing',verified:true,preferred:true},{id:'c2',name:'Swift Home Repairs',trade:'General repairs',verified:true,preferred:false},{id:'c3',name:'Unknown Trades Demo',trade:'General repairs',verified:false,preferred:false}],jobs:[{id:'demo1',property:'19 Kingsley Mews',issue:'Leaking kitchen tap',priority:'Routine',description:'Tenant reports a dripping kitchen tap.',status:'Reported',quotes:[],contractor:'',approved:0,invoice:0,paid:false,events:[{at:'Demo',message:'Tenant submitted repair request'}]}]});
function repairLoad(){try{const o=JSON.parse(localStorage.getItem(REPAIR_KEY));if(o&&o.settings&&Array.isArray(o.jobs)&&Array.isArray(o.contractors))return o}catch(e){}return repairDefaults()}
let REPAIRS=repairLoad();if(!REPAIRS.contractors.some(c=>c.id==='gas-demo')){REPAIRS.contractors.push({id:'gas-demo',name:'Demo Heating & Gas',trade:'Gas Safe engineer (fictional)',verified:true,preferred:true});try{localStorage.setItem(REPAIR_KEY,JSON.stringify(REPAIRS))}catch(e){}}let repairTab='jobs';let repairSelected='demo1';
function repairSave(){try{localStorage.setItem(REPAIR_KEY,JSON.stringify(REPAIRS))}catch(e){toast('Could not save demo data')}}
function repairLog(j,message){j.events.push({at:new Date().toLocaleString('en-GB'),message})}
// V5 portfolio defaults with optional property-specific repair overrides.
const REPAIR_TYPES=['Gas safety inspection','Leaking tap','Blocked drain','Toilet repair','Electrical fault','Heating / boiler','Broken window','Fence / garden','Roof / gutter','Other repair'];
function repairType(issue){const t=String(issue||'').toLowerCase();if(/gas safety|gas certificate|cp12|gas inspection/.test(t))return 'Gas safety inspection';if(/tap|faucet|drip/.test(t))return 'Leaking tap';if(/drain|blocked pipe/.test(t))return 'Blocked drain';if(/toilet|cistern|flush/.test(t))return 'Toilet repair';if(/electric|socket|light|wiring/.test(t))return 'Electrical fault';if(/boiler|radiator|heating|hot water/.test(t))return 'Heating / boiler';if(/window|glass/.test(t))return 'Broken window';if(/fence|garden|gate/.test(t))return 'Fence / garden';if(/roof|gutter/.test(t))return 'Roof / gutter';return 'Other repair'}
function repairInitRules(){if(!REPAIRS.smartRules){REPAIRS.smartRules={defaults:{},overrides:{}};REPAIR_TYPES.forEach(t=>REPAIRS.smartRules.defaults[t]={mode:'auto',limit:t==='Leaking tap'?50:REPAIRS.settings.limit});REPAIRS.smartRules.defaults['Gas safety inspection']={mode:'auto',limit:150};REPAIRS.smartRules.defaults['Electrical fault']={mode:'ask',limit:0};REPAIRS.smartRules.defaults['Heating / boiler']={mode:'ask',limit:0};REPAIRS.smartRules.defaults['Roof / gutter']={mode:'ask',limit:0};repairSave()}}
function repairRule(property,type){repairInitRules();return REPAIRS.smartRules.overrides[property]?.[type]||REPAIRS.smartRules.defaults[type]||{mode:'ask',limit:0}}
function repairDecide(j,q){const s=REPAIRS.settings,c=REPAIRS.contractors.find(x=>x.id===q.contractor),type=j.type||repairType(j.issue),rule=repairRule(j.property,type);if(!c||!c.verified)return 'Requires approval: contractor not verified';if(!c.preferred)return 'Requires approval: not a preferred contractor';if(j.priority!=='Routine')return 'Requires approval: urgent or safety-related job';if(rule.mode==='ask')return 'Requires approval: landlord chose Always ask me for '+type;if(q.amount>rule.limit)return 'Requires approval: above '+type+' limit of '+gbp(rule.limit);if(q.amount+s.spent>s.monthly)return 'Requires approval: monthly budget exceeded';if(j.status!=='Reported'&&j.status!=='Quotes received')return 'Requires review: job already progressed';return 'Eligible for automatic approval ('+type+' limit '+gbp(rule.limit)+')'}
let repairRuleProperty='__all__';
function repairSmartRulesPage(){repairInitRules();const sr=REPAIRS.smartRules;const selected=repairRuleProperty;let html='<div class="card"><h2>Smart repair approval rules</h2><p class="mut">Set portfolio-wide rules, then override individual properties. Changes apply to new quotes, not existing approvals.</p><label>Rules for</label><select id="smart-property" style="width:100%;padding:12px;margin:8px 0 16px;border:1px solid #cad5d1;border-radius:9px">'+[['__all__','All properties (portfolio defaults)'],...P.map(x=>[x.addr,x.addr])].map(([v,n])=>`<option value="${me(v)}" ${v===selected?'selected':''}>${me(n)}</option>`).join('')+'</select><p class="mut">Individual properties inherit portfolio rules unless an override is saved.</p>';
REPAIR_TYPES.forEach((type,i)=>{const override=selected!=='__all__'&&sr.overrides[selected]?.[type];const rule=override||sr.defaults[type];html+=`<form data-smart-rule="${i}" class="repair-layout" style="border-top:1px solid #dbe4e1;padding:16px 0;margin-top:8px"><h3 style="margin:0">${me(type)} ${override?'<span class="chip ok">Property override</span>':selected==='__all__'?'':'<span class="mut" style="font-size:12px">Inherited</span>'}</h3><div><label>Approval</label><select name="mode"><option value="auto" ${rule.mode==='auto'?'selected':''}>Auto approve up to limit</option><option value="ask" ${rule.mode==='ask'?'selected':''}>Always ask me</option></select></div><div><label>Limit (£)</label><input type="number" min="0" max="100000" step="1" name="limit" value="${rule.limit}" required></div><div class="chips"><button class="btn" type="submit">Save ${selected==='__all__'?'default':'property rule'}</button>${selected!=='__all__'&&override?`<button class="btn g" type="button" data-smart-reset="${i}">Use portfolio default</button>`:''}</div></form>`});return html+'<p class="mut">Urgent and emergency reports always require human review. Contractor verification and the overall maintenance budget still apply. These are demo rules; no contractors are contacted.</p></div>'}

// Version 6: purely fictional wallet ledger; no payment processor, bank data or funds.
function walletDefault(){return {mode:'combined',withdrawal:'percentage',percent:80,fixed:500,automatic:true,bankFallback:false,balances:Object.fromEntries(P.map(p=>[p.addr,0])),ledger:[],pending:[],autoOnClear:true,demoSeeded:false}}
function walletLoad(){try{const x=JSON.parse(localStorage.getItem(WALLET_KEY));if(x&&x.balances&&Array.isArray(x.ledger))return Object.assign(walletDefault(),x)}catch(e){}return walletDefault()}
let WALLET=walletLoad();
function walletSave(){try{localStorage.setItem(WALLET_KEY,JSON.stringify(WALLET))}catch(e){toast('Wallet demo could not save')}}
function walletPendingTotal(){return (WALLET.pending||[]).reduce((n,x)=>n+x.amount,0)}
function walletClearRent(id){const i=(WALLET.pending||[]).findIndex(x=>x.id===id);if(i<0)return;const item=WALLET.pending.splice(i,1)[0];WALLET.balances[item.property]=(Number(WALLET.balances[item.property])||0)+item.amount;walletRecord(item.property,item.amount,'Cleared rent received (demo)');const payout=WALLET.withdrawal==='percentage'?Math.round(item.amount*WALLET.percent)/100:WALLET.withdrawal==='fixed'?Math.min(item.amount,WALLET.fixed):0;if(WALLET.autoOnClear&&payout>0&&walletDebit(item.property,payout))walletRecord(item.property,-payout,'Automatic landlord payout (demo)');walletTryPending();walletSave()}
function walletTotal(){return Object.values(WALLET.balances).reduce((a,b)=>a+Number(b||0),0)}
function walletAvailable(property){return WALLET.mode==='combined'?walletTotal():Number(WALLET.balances[property]||0)}
function walletRecord(property,amount,description){WALLET.ledger.unshift({id:'txn-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),property,amount,description,at:new Date().toLocaleString('en-GB')});walletSave()}
function walletDebit(property,amount){if(walletAvailable(property)<amount)return false;let remaining=amount;const names=WALLET.mode==='combined'?[property,...P.map(p=>p.addr).filter(x=>x!==property)]:[property];for(const name of names){const take=Math.min(remaining,Number(WALLET.balances[name]||0));WALLET.balances[name]-=take;remaining-=take;if(remaining<.001)break}return remaining<.001}
function walletPayJob(j,manual){if(j.compliance&&j.compliance.status!=='Validated'){j.paymentStatus='Safety document requires landlord review';return false}if(!j.invoiceEvidence){j.paymentStatus='Invoice document required';return false}if(j.paid||j.status!=='Completed'||!(j.invoice>0))return false;if(j.paymentNeedsApproval&&!j.paymentApproved)return false;if(!walletDebit(j.property,j.invoice)){j.paymentStatus='Awaiting funds';repairLog(j,'Payment pending: insufficient demo wallet funds');repairSave();return false}j.status='Paid';j.paid=true;j.paymentStatus='Paid (demo)';walletRecord(j.property,-j.invoice,'Contractor invoice: '+j.issue);repairLog(j,(manual?'Landlord approved':'Automatically processed')+' '+gbp(j.invoice)+' contractor invoice from demo wallet; no money moved');repairSave();return true}
function walletAttemptPayment(j){if(j.compliance&&j.compliance.status!=='Validated'){j.paymentStatus='Certificate awaiting review';repairSave();return}if(!j.invoiceEvidence||!j.afterPhoto){j.paymentStatus='Invoice and completion evidence required';repairSave();return}if(j.paid||j.status!=='Completed')return;if(j.paymentNeedsApproval){j.paymentStatus='Awaiting landlord completion & payment approval';repairLog(j,'Non-trusted contractor: landlord must approve completed job and payment');repairSave();return}if(!WALLET.automatic){j.paymentStatus='Awaiting landlord payment approval';repairSave();return}walletPayJob(j,false)}
function walletTryPending(){REPAIRS.jobs.filter(j=>j.status==='Completed'&&!j.paid&&!j.paymentNeedsApproval&&WALLET.automatic&&j.invoiceEvidence&&j.afterPhoto&&(!j.compliance||j.compliance.status==='Validated')).forEach(j=>walletPayJob(j,false))}
function walletPage(){const total=walletTotal(),pending=REPAIRS.jobs.filter(j=>j.status==='Completed'&&!j.paid);return `<h1>RentWise Wallet</h1><p class="mut">Demo balance and automated payout rules. No real rent or money moves.</p><div class="repair-banner"><b>Simulation only:</b> fictional balances, payments and withdrawals. In production, an authorised payments provider would hold and move funds.</div><div class="card hero" style="margin:12px 0"><div><small>Combined portfolio total</small><h1>${gbp(total)}</h1><p>Across ${P.length} properties · ${WALLET.mode==='combined'?'Shared available pool':'Separate spending pots'}</p></div></div><div class="grid k4" style="margin:12px 0"><div class="card kpi"><span class="mut">Cleared funds</span><b>${gbp(total)}</b></div><div class="card kpi"><span class="mut">Rent processing</span><b>${gbp(walletPendingTotal())}</b></div><div class="card kpi"><span class="mut">Available now</span><b>${gbp(walletAvailable(P[0].addr))}</b></div><div class="card kpi"><span class="mut">Unpaid invoices</span><b>${pending.length}</b></div></div><div class="grid two"><div class="card"><h2>Balance settings</h2><form id="wallet-settings" class="market-form"><label>Manage available money as</label><select name="mode"><option value="combined" ${WALLET.mode==='combined'?'selected':''}>One combined balance</option><option value="separate" ${WALLET.mode==='separate'?'selected':''}>Separate property balances</option></select><label>Landlord withdrawal method</label><select name="withdrawal"><option value="percentage" ${WALLET.withdrawal==='percentage'?'selected':''}>Automatic percentage of available rent</option><option value="fixed" ${WALLET.withdrawal==='fixed'?'selected':''}>Fixed amount</option><option value="manual" ${WALLET.withdrawal==='manual'?'selected':''}>Manual only</option></select><label>Automatic withdrawal percentage (0–100%)</label><input type="number" min="0" max="100" name="percent" value="${WALLET.percent}"><label>Fixed withdrawal amount (£)</label><input type="number" min="0" max="100000" name="fixed" value="${WALLET.fixed}"><label><input type="checkbox" name="autoOnClear" ${WALLET.autoOnClear?'checked':''} style="width:auto;min-height:0"> Automatically pay landlord when rent clears</label><label><input type="checkbox" name="automatic" ${WALLET.automatic?'checked':''} style="width:auto;min-height:0"> Automatically pay eligible trusted-contractor invoices when funds are available</label><button class="btn" style="margin-top:12px" type="submit">Save wallet preferences</button></form></div><div class="card"><h2>Try the wallet demo</h2><p class="mut">Add fictional rent, then pay eligible invoices or simulate a landlord withdrawal.</p><form id="wallet-rent" class="market-form"><label>Property receiving rent</label><select name="property">${P.map(p=>`<option value="${me(p.addr)}">${me(p.addr)}</option>`).join('')}</select><label>Amount (£)</label><input type="number" name="amount" min="1" max="100000" required value="1200"><button class="btn" style="margin-top:12px" type="submit">Simulate tenant rent payment</button></form><div class="row"><b>Rent awaiting clearance (${(WALLET.pending||[]).length})</b></div>${(WALLET.pending||[]).map(x=>`<div class="row"><div><b>${me(x.property)}</b><br><span class="mut">${gbp(x.amount)} processing · not available</span></div><button class="btn g" data-wallet-clear="${me(x.id)}">Mark cleared (demo)</button></div>`).join('')||'<p class="mut">No rent processing.</p>'}<div class="row"><b>Withdraw cleared balance (demo)</b></div><form id="wallet-withdraw" class="market-form"><label>Property (for separate balances)</label><select name="property">${P.map(p=>`<option value="${me(p.addr)}">${me(p.addr)}</option>`).join('')}</select><label>Manual withdrawal (£)</label><input name="amount" type="number" min="1" max="100000" required value="100"><button class="btn g" type="submit" style="margin-top:12px">Simulate withdrawal</button></form><button class="btn g" data-wallet-auto style="margin-top:10px">Simulate scheduled withdrawal</button></div></div><div class="card" style="margin-top:12px"><h2>Property balances</h2>${P.map(p=>`<div class="row"><span>${me(p.addr)}</span><b>${gbp(WALLET.balances[p.addr]||0)}</b></div>`).join('')}</div><div class="card" style="margin-top:12px"><h2>Contractor invoices awaiting payment (${pending.length})</h2>${pending.length?pending.map(j=>`<div class="row"><div><b>${me(j.issue)}</b><br><span class="mut">${me(j.property)} · ${me(j.paymentStatus||'Awaiting payment')}</span></div><b>${gbp(j.invoice)}</b></div>`).join(''):'<p class="mut">No outstanding completed-job invoices.</p>'}</div><div class="card" style="margin-top:12px"><h2>Wallet activity</h2>${WALLET.ledger.length?WALLET.ledger.slice(0,25).map(x=>`<div class="row"><div><b>${me(x.description)}</b><br><span class="mut">${me(x.property)} · ${me(x.at)}</span></div><b style="color:${x.amount<0?'var(--bad)':'var(--ok)'}">${x.amount<0?'−':'+'}${gbp(Math.abs(x.amount))}</b></div>`).join(''):'<p class="mut">No demo transactions yet. Simulate a rent payment to start.</p>'}</div>`}
document.addEventListener('submit',e=>{const id=e.target.id;if(!['wallet-settings','wallet-rent','wallet-withdraw'].includes(id))return;e.preventDefault();const f=new FormData(e.target);if(id==='wallet-settings'){WALLET.mode=String(f.get('mode'));WALLET.withdrawal=String(f.get('withdrawal'));WALLET.percent=Math.max(0,Math.min(100,Number(f.get('percent'))||0));WALLET.fixed=Math.max(0,Number(f.get('fixed'))||0);WALLET.automatic=f.has('automatic');WALLET.autoOnClear=f.has('autoOnClear');walletSave();walletTryPending();toast('Wallet settings saved (demo)')}else if(id==='wallet-rent'){const property=String(f.get('property')),amount=Number(f.get('amount'));if(!P.some(p=>p.addr===property)||!(amount>0&&amount<=100000))return;WALLET.pending??=[];WALLET.pending.push({id:'rent-'+Date.now(),property,amount});walletSave();toast('Rent processing. Mark cleared before withdrawal')}else{const property=String(f.get('property')),amount=Number(f.get('amount'));if(!(amount>0&&amount<=100000)||!walletDebit(property,amount)){toast('Not enough available demo funds');return}walletRecord(property,-amount,'Manual landlord withdrawal (simulation)');toast('Demo withdrawal recorded')}render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-wallet-auto]');if(!b)return;if(WALLET.withdrawal==='manual'){toast('Manual withdrawals selected');return}const total=walletTotal(),amount=WALLET.withdrawal==='percentage'?Math.round(total*WALLET.percent)/100:Math.min(total,WALLET.fixed);if(!(amount>0)){toast('No available demo funds to withdraw');return}if(!walletDebit(P[0].addr,amount)){toast('Cannot withdraw from selected balances');return}walletRecord('Portfolio',-amount,'Scheduled landlord withdrawal (simulation)');render();toast('Scheduled withdrawal simulated')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-wallet-clear]');if(!b)return;walletClearRent(b.dataset.walletClear);render();toast('Rent cleared; payout rules applied (demo)')});
function repairApprove(j,q,automatic){if(!Number.isFinite(q.amount)||q.amount<=0)return;if(j.status==='Approved'||j.status==='Completed'||j.status==='Paid')return;const s=REPAIRS.settings;j.status='Approved';j.approved=q.amount;j.contractor=q.contractor;j.approvalType=automatic?'Automatic under landlord rules':'Manually approved by landlord';j.paymentNeedsApproval=!automatic; j.paymentApproved=false;s.spent+=q.amount;repairLog(j,`${j.approvalType}: ${gbp(q.amount)} reserved against monthly budget`);repairSave()}
function repairPage(){
 const s=REPAIRS.settings,j=REPAIRS.jobs.find(x=>x.id===repairSelected)||REPAIRS.jobs[0];
 let h='<h1>AI Repairs Agent</h1><p class="mut">Tenant report → contractor quote → automatic rules → job → invoice → accounts.</p><div class="repair-banner"><b>Investor demo only.</b> Rule-based simulation, not live AI. No messages or payments are sent. Use fictional data only.</div>';

 if(!j)return h;

 if(['Reported','Quotes received'].includes(j.status))h+='<h3>Contractor submits a quote</h3><form id="repair-quote" class="repair-layout"><div><label>Contractor</label><select name="contractor">'+REPAIRS.contractors.map(c=>`<option value="${me(c.id)}">${me(c.name)}</option>`).join('')+'</select></div><div><label>Price (£)</label><input type="number" name="amount" min="1" max="100000" required></div><button class="btn" type="submit">Check quote against rules</button></form>';

function v12Scan(){let count=0;P.forEach(p=>{const d=v12Days(v12Due(p));if(d<=45&&!v12Job(p)){v12Start(p);count++}});return count}
function v12Page(){repairInitRules();const rows=P.map(p=>({p,days:v12Days(v12Due(p)),job:v12Job(p)})).sort((a,b)=>a.days-b.days);const active=rows.filter(x=>x.days<=45||x.job);return `<h1>AI Compliance Automation</h1><p class="mut">Version 12 · Simulated certificate monitoring, trusted engineer invitations, quotes, validation and accounting.</p><div class="repair-banner"><b>Demo only.</b> No contractor is contacted. No certificate is checked by real AI. A qualified person must confirm engineer registration, inspection findings and legally correct due dates before a certificate is marked valid.</div>
<div class="grid k4" style="margin:12px 0"><div class="card kpi"><span class="mut">Within 45 days / overdue</span><b>${rows.filter(x=>x.days<=45).length}</b></div><div class="card kpi"><span class="mut">Renewal jobs opened</span><b>${active.filter(x=>x.job).length}</b></div><div class="card kpi"><span class="mut">Need approval</span><b>${active.filter(x=>x.job?.status==='Quotes received').length}</b></div><div class="card kpi"><span class="mut">Awaiting validation</span><b>${active.filter(x=>x.job?.compliance?.status==='Awaiting landlord review').length}</b></div></div>
<div class="card"><h2>45-day expiry monitor</h2><p>Click to simulate a daily compliance scan. RentWise creates one renewal job per property and queues an invitation for the trusted engineer. It will not create duplicates.</p><button class="btn" data-v12-scan>Run 45-day scan (demo)</button><p class="mut" style="margin-top:8px">Future product: this would run automatically in the background and chase unanswered invitations.</p></div>
<div class="card" style="margin-top:12px"><h2>Renewal workflow</h2>${active.length?active.map(({p,days,job})=>`<div style="padding:14px 0;border-top:1px solid var(--line)"><div class="row"><div><b>${me(p.addr)}</b><br><span class="mut">Gas safety due ${me(v12Due(p))} · ${days<0?Math.abs(days)+' days overdue':days+' days left'}</span></div><span class="chip ${days<0?'bad':days<=45?'warn':'ok'}">${days<0?'Overdue':days<=45?'Renewal window':'In progress'}</span></div>
${!job?'<p class="mut">No renewal initiated yet.</p>':`<p><b>Stage:</b> ${me(job.status)} · ${me(job.paymentStatus||'Awaiting quote / inspection')}</p><p class="mut">Trusted engineer: Demo Heating & Gas · invitation queued (simulation only)</p>${job.status==='Reported'||job.status==='Quotes received'?`<form data-v12-quote="${me(job.id)}" class="market-form"><label>Engineer quote (£)</label><input type="number" name="amount" min="1" max="100000" value="95" required><button class="btn" type="submit" style="margin-top:8px">Simulate engineer quote</button></form>`:''}${job.status==='Quotes received'?'<p class="chip warn">Over approval limit — landlord must authorise quote in AI Repairs</p>':''}${job.status==='Approved'?'<p class="chip ok">Quote approved — contractor can upload certificate and invoice</p>':''}${job.compliance?.status==='Awaiting landlord review'?'<p class="chip warn">Safety record awaits human validation — no automatic compliance clearance</p>':''}${job.status==='Paid'?'<p class="chip ok">Validated renewal and invoice paid (demo)</p>':''}<button class="btn g" data-v12-open="${me(job.id)}" style="margin-top:8px">Open job in AI Repairs</button><button class="btn g" data-v12-contractor="${me(job.id)}" style="margin-top:8px">Open contractor upload</button>`}</div>`).join(''):'<p class="mut">No gas certificates due within 45 days.</p>'}</div>
<div class="card" style="margin-top:12px"><h2>All properties</h2>${rows.map(({p,days})=>`<div class="row"><div><b>${me(p.addr)}</b><br><span class="mut">Next gas safety date: ${me(v12Due(p))}</span></div><span class="chip ${days<=45?'warn':'ok'}">${days<0?'Overdue':days+' days'}</span></div>`).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-v12-scan],[data-v12-open],[data-v12-contractor]');if(!b)return;if(b.hasAttribute('data-v12-scan')){const n=v12Scan();toast(n+' renewal jobs created (demo)')}else if(b.dataset.v12Open){repairSelected=b.dataset.v12Open;repairTab='jobs';DEMO_ROLE='landlord';S.v='repairs'}else if(b.dataset.v12Contractor){const j=REPAIRS.jobs.find(x=>x.id===b.dataset.v12Contractor);if(j?.contractor)DEMO_CONTRACTOR=j.contractor;else DEMO_CONTRACTOR='gas-demo';DEMO_ROLE='contractor';S.v='contractor'}render()});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-v12-quote]');if(!form)return;e.preventDefault();const j=REPAIRS.jobs.find(x=>x.id===form.dataset.v12Quote);if(!j||!['Reported','Quotes received'].includes(j.status))return;const amt=Number(new FormData(form).get('amount'));if(!(amt>0&&amt<=100000))return;const q={contractor:'gas-demo',amount:amt};q.decision=repairDecide(j,q);j.quotes.push(q);repairLog(j,'Gas engineer quote '+gbp(amt)+': '+q.decision);if(q.decision.startsWith('Eligible for automatic approval'))repairApprove(j,q,true);else j.status='Quotes received';repairSave();render();toast(q.decision)});

function render(){const V={v12:v12Page,showcase:showcasePage,wallet:walletPage,repairs:repairPage,market:marketPage,dash,props:()=>S.p==null?props():det(),comp,fin,ai,tenant:tenantPage,contractor:contractorPage};
$('#nav').innerHTML=`<div class="brand">${logo}<div>RentWise<small>Your property. Your way.</small></div></div>`+(DEMO_ROLE==='landlord'?NAV:DEMO_ROLE==='tenant'?[['tenant','My home','M3 11l9-8 9 8M5 9.5V21h14V9.5M10 21v-6h4v6'],['market','Explore homes','M3 10l9-7 9 7v11H3zM9 21v-8h6v8']]:[['contractor','My jobs','M14 7l3 3-7 7-3-3zM3 21l6-6M16 3l5 5']]).map(n=>`<button class="b ${S.v==n[0]?'on':''}" data-v="${n[0]}">${ic(n[2])}${n[1]}</button>`).join('');
$('#main').innerHTML=`<div class="top">${logo}<div>RentWise<small>Your property. Your way.</small></div></div>`+demoRoleBar()+V[S.v]();
$('#mod').innerHTML=S.m?modal():'';
document.querySelectorAll('.tap').forEach(e=>{e.tabIndex=0;e.setAttribute('role','button')});}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-p],[data-back],[data-ct],[data-rv],[data-ok],[data-no],[data-un],[data-toast],[data-q],[data-x]');if(!t)return;const d=t.dataset;
if(d.x!=null){if(t.classList.contains('modal')&&e.target!==t)return;S.m=null;render();return}
if(d.toast){toast(d.toast);return}
if(d.v){S.v=d.v;S.p=null}else if(d.p!=null){S.v='props';S.p=+d.p}else if(d.back!=null)S.p=null;
else if(d.ct!=null)S.ct=d.ct;else if(d.rv)S.m=d.rv;
else if(d.ok){S.st[d.ok]='ok';S.m=null;toast('Approved. Queued for sending (demo only, nothing was sent).')}
else if(d.no)S.st[d.no]='no';else if(d.un)delete S.st[d.un];else if(d.q!=null)S.chat=Q[d.q][1];
render();if(!d.ct&&!d.q&&!d.ok&&!d.no&&!d.un&&!d.rv)scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.classList.contains('tap'))e.target.click();if(e.key=='Escape'&&S.m){S.m=null;render()}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
